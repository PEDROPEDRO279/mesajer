<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Yerel Mesajlaşma & Grup Platformu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* GİRİŞ EKRANI */
        #login-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); max-width: 380px; width: 100%; }
        .login-box input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .avatar-select-label { display: block; margin: 10px 0; font-size: 13px; color: #007bff; cursor: pointer; font-weight: bold; }
        .login-box button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .login-box button:hover { background: #0056b3; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px; display: block; border: 2px solid #ddd; }

        /* ANA PANEL */
        .app-container { display: flex; width: 96vw; height: 92vh; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
        
        /* SOL PANEL */
        .sidebar { width: 32%; min-width: 300px; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; background: #ffffff; }
        .profile-bar { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; }
        .profile-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        .search-box { padding: 12px; border-bottom: 1px solid #e0e0e0; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        #search-results { background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; max-height: 120px; overflow-y: auto; margin-top: 5px; }
        
        /* GRUP KURMA ALANI */
        .group-creation-box { padding: 12px; background: #f1f3f4; border-bottom: 1px solid #e0e0e0; }
        .group-creation-box input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .friend-checkbox-list { max-height: 80px; overflow-y: auto; background: white; padding: 5px; border-radius: 4px; border: 1px solid #ddd; margin-bottom: 8px; font-size: 13px; }
        .group-btn { width: 100%; padding: 8px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }

        .list-title { padding: 10px 15px; font-size: 12px; color: #777; font-weight: bold; background: #fafafa; border-bottom: 1px solid #eee; }
        .items-list { flex: 1; overflow-y: auto; }
        .list-item { padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid #eee; }
        .list-item:hover { background: #f0f2f5; }
        .list-item.active { background: #e8f0fe; }
        .item-details { display: flex; align-items: center; gap: 10px; }

        /* SAĞ PANEL */
        .chat-area { width: 68%; display: flex; flex-direction: column; background: #efeae2; }
        .chat-header { padding: 15px; background: #f0f2f5; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 60%; word-wrap: break-word; font-size: 14px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message .sender-name { font-size: 11px; color: #666; font-weight: bold; margin-bottom: 3px; block-size: auto; }
        .message.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .message.received { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .message img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; max-height: 200px; object-fit: cover; }

        .message-input-area { padding: 15px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        .message-input-area input[type="text"] { margin: 0; flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        .img-send-btn { background: #6c757d; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .send-btn { padding: 12px 25px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- GİRİŞ VE KAYIT EKRANI -->
    <div id="login-screen" class="hidden">
        <div class="login-box">
            <h2 id="login-title" style="margin-bottom: 15px;">Giriş Yap veya Kaydol</h2>
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>" id="avatar-preview-img" class="avatar-preview">
            <input type="text" id="username-input" placeholder="Kullanıcı adınızı belirleyin...">
            <label class="avatar-select-label" for="avatar-file-input">📸 Profil Fotoğrafı Seç</label>
            <input type="file" id="avatar-file-input" accept="image/*" class="hidden">
            <button id="login-btn">Devam Et</button>
        </div>
    </div>

    <!-- ANA UYGULAMA PANELİ -->
    <div class="app-container">
        <!-- SOL PANEL -->
        <div class="sidebar">
            <div class="profile-bar">
                <div class="profile-info">
                    <img id="my-avatar" class="user-avatar" src="">
                    <span id="my-username" style="font-weight: bold;">-</span>
                </div>
                <button class="logout-btn" id="logout-btn">Çıkış Yap</button>
            </div>
            
            <!-- Arama -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Yeni arkadaş ara...">
                <div id="search-results" class="hidden"></div>
            </div>

            <!-- Grup Oluşturma Modülü -->
            <div class="group-creation-box">
                <input type="text" id="group-name-input" placeholder="Grup adı yazın...">
                <div style="font-size: 11px; color:#555; margin-bottom:3px; font-weight:bold;">Gruptakileri Seçin:</div>
                <div class="friend-checkbox-list" id="group-friend-checkboxes"></div>
                <button class="group-btn" id="create-group-btn">👥 Yeni Grup Kur</button>
            </div>

            <div class="list-title">SOHBETLERİM & ARKADAŞLARIM</div>
            <div class="items-list" id="items-list"></div>
        </div>

        <!-- SAĞ PANEL -->
        <div class="chat-area">
            <div class="chat-header">
                <img id="chat-avatar" class="user-avatar hidden" src="">
                <span id="chat-title">Sohbet Seçilmedi</span>
            </div>
            
            <div class="messages-container" id="messages-container">
                <div style="text-align:center; color:#888; margin:auto; font-size:14px;">Mesajlaşmak veya grup kurmak için sol paneli kullanın.</div>
            </div>

            <div class="message-input-area">
                <label class="img-send-btn" for="msg-image-input">🖼️</label>
                <input type="file" id="msg-image-input" accept="image/*" class="hidden" disabled>
                <input type="text" id="message-input" placeholder="Bir mesaj yazın..." disabled>
                <button class="send-btn" id="send-btn" disabled>Gönder</button>
            </div>
        </div>
    </div>

    <script>
        // --- GELİŞMİŞ LOCALSTORAGE VERİTABANI ALTYAPISI ---
        let db = JSON.parse(localStorage.getItem('mega_chat_db')) || { users: {}, chats: {}, session: null };
        function saveDB() { localStorage.setItem('mega_chat_db', JSON.stringify(db)); }

        let currentUser = null;
        let activeTarget = null; // Arkadaş ID'si veya Grup ID'si olabilir
        let isGroupChat = false;
        let tempAvatarBase64 = "";

        // DOM Elementleri
        const loginScreen = document.getElementById('login-screen');
        const usernameInput = document.getElementById('username-input');
        const avatarFileInput = document.getElementById('avatar-file-input');
        const avatarPreviewImg = document.getElementById('avatar-preview-img');
        const loginBtn = document.getElementById('login-btn');
        const myAvatar = document.getElementById('my-avatar');
        const myUsername = document.getElementById('my-username');
        const logoutBtn = document.getElementById('logout-btn');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const groupNameInput = document.getElementById('group-name-input');
        const groupFriendCheckboxes = document.getElementById('group-friend-checkboxes');
        const createGroupBtn = document.getElementById('create-group-btn');
        const itemsList = document.getElementById('items-list');
        const chatAvatar = document.getElementById('chat-avatar');
        const chatTitle = document.getElementById('chat-title');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const msgImageInput = document.getElementById('msg-image-input');
        const sendBtn = document.getElementById('send-btn');

        // Varsayılan Avatar Resmi SVG'si
        const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 1.79 4 2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>";

        // --- 1. OTURUM KONTROLÜ (CIHAZDA KALICI HESAP) ---
        window.addEventListener('load', () => {
            if (db.session) {
                initUser(db.session);
            } else {
                loginScreen.classList.remove('hidden');
            }
        });

        // Girişte Profil Resmi Okuma
        avatarFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    tempAvatarBase64 = reader.result;
                    avatarPreviewImg.src = tempAvatarBase64;
                }
                reader.readAsDataURL(file);
            }
        });

        // Kayıt ve Giriş İşlemi
        loginBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim().toLowerCase();
            if(!username) return alert('Lütfen geçerli bir isim girin!');

            // İSİM BİR DAHA ALINAMASIN KONTROLÜ
            if(db.users[username]) {
                // Eğer bu cihazda daha önce girilmiş bir hesapsa şifresiz geçişe izin verilebilir, 
                // ancak "isim bir daha alınamaz" kuralını kesin korumak için yeni kayıt engellenir.
                alert('Bu kullanıcı adı sistemde kayıtlıdır! Başka bir isim deneyin.');
                return;
            }

            // Yeni Kullanıcı Oluşturma
            db.users[username] = {
                username: username,
                avatar: tempAvatarBase64 || defaultAvatar,
                friends: [],
                groups: []
            };
            db.session = username; // Cihaz oturumuna kaydet
            saveDB();
            initUser(username);
        });

        function initUser(username) {
            currentUser = username;
            myUsername.innerText = currentUser;
            myAvatar.src = db.users[currentUser].avatar || defaultAvatar;
            loginScreen.classList.add('hidden');
            renderSidebarLists();
            renderCheckboxFriends();
            listenStorage();
        }

        // Çıkış Yapma (Oturumu Kapatır ama Hesap Veritabanında Kalır)
        logoutBtn.addEventListener('click', () => {
            db.session = null;
            saveDB();
            location.reload();
        });

        // --- 2. ARKADAŞ ARAMA VE EKLEME ---
        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            searchResults.innerHTML = '';
            if(!q) return searchResults.classList.add('hidden');
            searchResults.classList.remove('hidden');
            
            let found = false;
            Object.keys(db.users).forEach(uname => {
                if(uname.includes(q) && uname !== currentUser) {
                    found = true;
                    const isFriend = db.users[currentUser].friends.includes(uname);
                    const div = document.createElement('div');
                    div.style.padding = '10px';
                    div.style.display = 'flex';
                    div.style.justifyContent = 'space-between';
                    div.style.alignItems = 'center';
                    div.style.borderBottom = '1px solid #eee';
                    div.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <img src="${db.users[uname].avatar}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
                            <strong>${uname}</strong>
                        </div>
                        ${isFriend ? '<span style="color:green; font-size:12px;">Arkadaş</span>' : `<button onclick="addFriend('${uname}')" style="padding:4px 8px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer;">Ekle</button>`}
                    `;
                    searchResults.appendChild(div);
                }
            });
            if(!found) searchResults.innerHTML = '<div style="padding:10px; color:#888; text-align:center; font-size:12px;">Kullanıcı bulunamadı.</div>';
        });

        window.addFriend = function(fName) {
            if(!db.users[currentUser].friends.includes(fName)) {
                db.users[currentUser].friends.push(fName);
                if(!db.users[fName].friends.includes(currentUser)) db.users[fName].friends.push(currentUser); // Karşılıklı ekleme
                saveDB();
                searchInput.value = ''; searchResults.classList.add('hidden');
                renderSidebarLists();
                renderCheckboxFriends();
            }
        };

        // --- 3. ÇOKLU ARKADAŞ SEÇEREK GRUP OLUŞTURMA ---
        function renderCheckboxFriends() {
            groupFriendCheckboxes.innerHTML = '';
            const friends = db.users[currentUser].friends || [];
            if(friends.length === 0) {
                groupFriendCheckboxes.innerHTML = '<div style="color:#aaa; text-align:center; padding-top:5px;">Önce arkadaş ekleyin.</div>';
                return;
            }
            friends.forEach(f => {
                const label = document.createElement('label');
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.gap = '5px';
                label.style.marginBottom = '3px';
                label.innerHTML = `<input type="checkbox" value="${f}" class="group-member-check"> ${f}`;
                groupFriendCheckboxes.appendChild(label);
            });
        }

        createGroupBtn.addEventListener('click', () => {
            const gName = groupNameInput.value.trim();
            if(!gName) return alert('Lütfen bir grup adı yazın!');

            const checkedBoxes = document.querySelectorAll('.group-member-check:checked');
            const members = [currentUser];
            checkedBoxes.forEach(box => members.push(box.value));

            if(members.length < 2) return alert('Grup oluşturmak için en az 1 arkadaş seçmelisiniz!');

            const gId = 'group_' + Date.now();
            
            // Veritabanına grubu kaydet
            if(!db.groups) db.groups = {};
            db.groups[gId] = {
                id: gId,
                name: gName,
                avatar: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23007bff'><path d='M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z'/></svg>",
                members: members
            };

            // Gruba katılan tüm üyelerin listesine grubu ekle
            members.forEach(m => {
                if(!db.users[m].groups) db.users[m].groups = [];
                if(!db.users[m].groups.includes(gId)) db.users[m].groups.push(gId);
            });

            saveDB();
            groupNameInput.value = '';
            renderSidebarLists();
            alert(`"${gName}" grubu başarıyla kuruldu!`);
        });

        // --- 4. SOHBETLERİ LİSTELEME VE SEÇME ---
        function renderSidebarLists() {
            itemsList.innerHTML = '';
            
            // Önce Grupları Listele
            if(db.groups) {
                Object.keys(db.groups).forEach(gId => {
                    const group = db.groups[gId];
                    if(group.members.includes(currentUser)) {
                        const div = document.createElement('div');
                        div.className = `list-item ${activeTarget === gId ? 'active' : ''}`;
                        div.innerHTML = `
                            <div class="item-details">
                                <img src="${group.avatar}" class="user-avatar">
                                <div><strong>👥 ${group.name}</strong><br><span style="font-size:11px;color:#888;">Grup Sohbeti</span></div>
                            </div>
                        `;
                        div.addEventListener('click', () => openChatTarget(gId, true));
                        itemsList.appendChild(div);
                    }
                });
            }

            // Sonra Bireysel Arkadaşları Listele
            const friends = db.users[currentUser].friends || [];
            friends.forEach(fName => {
                const friendData = db.users[fName];
                if(friendData) {
                    const div = document.createElement('div');
                    div.className = `list-item ${activeTarget === fName ? 'active' : ''}`;
                    div.innerHTML = `
                        <div class="item-details">
                            <img src="${friendData.avatar}" class="user-avatar">
                            <div><strong>${friendData.username}</strong></div>
                        </div>
                    `;
                    div.addEventListener('click', () => openChatTarget(fName, false));
                    itemsList.appendChild(div);
                }
            });
        }

        function openChatTarget(targetId, isGroup) {
            activeTarget = targetId;
            isGroupChat = isGroup;

            chatAvatar.classList.remove('hidden');
            messageInput.disabled = false;
            sendBtn.disabled = false;
            msgImageInput.disabled = false;

            if(isGroupChat) {
                chatTitle.innerText = db.groups[targetId].name;
                chatAvatar.src = db.groups[targetId].avatar;
            } else {
                chatTitle.innerText = targetId;
                chatAvatar.src = db.users[targetId].avatar;
            }

            renderSidebarLists();
            renderMessages();
            messageInput.focus();
        }

        // --- 5. MESAJLARIN VE FOTOĞRAFLARIN GÖNDERİLMESİ ---
        function renderMessages() {
            messagesContainer.innerHTML = '';
            if(!activeTarget) return;

            // Oda ID'si belirleme (Grup ise direkt grup ID, şahıs ise sıralı isim kombinasyonu)
            const chatRoomId = isGroupChat ? activeTarget : [currentUser, activeTarget].sort().join('_');
            const history = db.chats[chatRoomId] || [];

            if(history.length === 0) {
                messagesContainer.innerHTML = '<div style="text-align:center; color:#999; margin:auto; font-size:13px;">Sohbet geçmişi boş.</div>';
                return;
            }

            history.forEach(msg => {
                const isMe = msg.sender === currentUser;
                const div = document.createElement('div');
                div.className = `message ${isMe ? 'sent' : 'received'}`;
                
                let contentHTML = `<div class="sender-name">${msg.sender}</div>`;
                if(msg.text) contentHTML += `<div>${msg.text}</div>`;
                if(msg.image) contentHTML += `<img src="${msg.image}">`;
                
                div.innerHTML = contentHTML;
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function commitMessage(text, base64Img) {
            if(!activeTarget) return;
            const chatRoomId = isGroupChat ? activeTarget : [currentUser, activeTarget].sort().join('_');
            
            if(!db.chats[chatRoomId]) db.chats[chatRoomId] = [];
            
            db.chats[chatRoomId].push({
                sender: currentUser,
                text: text,
                image: base64Img || null,
                time: Date.now()
            });

            saveDB();
            renderMessages();
        }

        // Yazılı Mesaj Gönderme
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if(!text) return;
            commitMessage(text, null);
            messageInput.value = '';
        });
        messageInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendBtn.click(); });

        // MESAJDA GÖRSEL GÖNDERME SİSTEMİ
        msgImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    commitMessage("", reader.result); // Fotoğrafı boş metinle gönder
                    msgImageInput.value = ""; // Seçiciyi sıfırla
                }
                reader.readAsDataURL(file);
            }
        });

        // --- 6. ANLIK SENKRONİZASYON (FARKLI PENCERELER) ---
        function listenStorage() {
            window.addEventListener('storage', () => {
                db = JSON.parse(localStorage.getItem('mega_chat_db')) || { users: {}, chats: {}, session: null };
                renderSidebarLists();
                if(activeTarget) renderMessages();
            });
        }
    </script>
</body>
</html>
